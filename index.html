<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fff7e8">
  <title>わくわく パズル</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div>
      <h1>わくわく パズル</h1>
      <p class="subtitle">ピースを ぴったり はめよう！</p>
    </div>
    <button id="settingsToggle" class="secondary" type="button" aria-expanded="false">おうちの人の設定</button>
  </header>

  <main>
    <section class="setup panel" aria-label="パズルの準備">
      <label class="file-label" for="imageInput">① あそぶ画像をえらぶ</label>
      <input id="imageInput" type="file" accept="image/*">
      <div class="image-row">
        <div id="previewWrap" class="preview-wrap">
          <div id="previewPlaceholder">ここに えらんだ画像が<br>表示されるよ</div>
          <img id="previewImage" alt="選択した画像のプレビュー" hidden>
        </div>
        <div class="setup-actions">
          <p id="imageStatus" class="hint">写真やイラストをえらんでね。</p>
          <button id="startButton" class="primary" type="button" disabled>パズルをはじめる！</button>
        </div>
      </div>
    </section>

    <section id="parentSettings" class="panel settings" hidden>
      <h2>おうちの人の設定</h2>
      <div class="setting-grid">
        <fieldset>
          <legend>ピースの数</legend>
          <label><input type="radio" name="pieceCount" value="4" checked> 4こ</label>
          <label><input type="radio" name="pieceCount" value="9"> 9こ</label>
          <label><input type="radio" name="pieceCount" value="16"> 16こ</label>
        </fieldset>
        <fieldset>
          <legend>ピースの回転</legend>
          <label><input type="checkbox" id="rotationEnabled"> 回転あり（90°ずつ）</label>
        </fieldset>
      </div>
      <p class="hint">設定はこの端末のブラウザーに保存されます。画像や遊んだ記録は保存しません。</p>
      <button id="settingsDone" class="secondary" type="button">設定をとじる</button>
    </section>

    <section id="gameSection" class="game panel" hidden>
      <div class="game-heading">
        <div>
          <h2 id="gameTitle">パズル</h2>
          <p id="gameHint" class="hint">ピースをえらんで、入れる場所をタップしてね。</p>
        </div>
        <div class="game-buttons">
          <button id="rotateLeft" class="secondary rotate" type="button" disabled aria-label="左に90度回転">↶ 回す</button>
          <button id="rotateRight" class="secondary rotate" type="button" disabled aria-label="右に90度回転">回す ↷</button>
          <button id="restartButton" class="secondary" type="button">やりなおす</button>
        </div>
      </div>
      <div class="canvas-wrap">
        <canvas id="gameCanvas" width="960" height="760" aria-label="パズル盤面"></canvas>
      </div>
      <div id="completion" class="completion" hidden>
        <div class="celebration" aria-hidden="true">🎉 ⭐ 🎉</div>
        <h2>できたね！ すごい！</h2>
        <p>ぜんぶのピースが はまったよ！</p>
        <button id="playAgain" class="primary" type="button">もういちど あそぶ</button>
      </div>
    </section>
  </main>
  <footer><p>画像はこの端末のブラウザー内で処理され、サーバーには送信されません。</p></footer>
  <script src="js/app.js"></script>
</body>
</html>
